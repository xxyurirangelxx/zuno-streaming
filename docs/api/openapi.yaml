openapi: 3.1.0

info:
  title: Zuno API
  version: 0.6.0
  summary: Contrato HTTP do servidor Zuno.
  description: |
    Contrato do M1b: healthcheck, biblioteca (faixas, álbuns, artistas, busca),
    capas e streaming com `Range`.

    Autenticação (M2a): sessão em cookie `zuno_session` (HttpOnly, SameSite=Lax).
    Públicas: `GET /health`, `GET /api/v1/setup/status`, `POST /api/v1/setup/claim`,
    `POST /api/v1/auth/login` e `POST /api/v1/invitations/redeem`. As demais exigem
    cookie de sessão válido.

    Erros seguem `{ "code": "snake_case", "message": "texto" }`.
  license:
    name: Apache-2.0

security:
  - cookieAuth: []

servers:
  - url: http://127.0.0.1:8080
    description: Desenvolvimento local (bind padrão).

tags:
  - name: system
  - name: library
  - name: media
  - name: auth
  - name: playlists
  - name: favorites
  - name: uploads
  - name: preferences

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Saúde do servidor e do banco.
      responses:
        '200':
          description: Serviço e banco operacionais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Banco indisponível; serviço degradado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /api/v1/tracks:
    get:
      tags: [library]
      operationId: listTracks
      summary: Lista faixas com filtros e paginação por cursor.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            name: cursor,
            in: query,
            schema: { type: string },
            description: Cursor opaco de `next_cursor`.,
          }
        - { name: album_id, in: query, schema: { type: string, format: uuid } }
        - { name: artist_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string }, description: Busca textual opcional. }
      responses:
        '200':
          description: Página de faixas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/tracks/{id}:
    get:
      tags: [library]
      operationId: getTrack
      summary: Detalhe da faixa, incluindo o arquivo de áudio.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalhe da faixa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tracks/{id}/stream:
    get:
      tags: [media]
      operationId: streamTrack
      summary: Baixa/reproduz o arquivo Opus, com suporte a `Range`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Range, in: header, schema: { type: string }, example: bytes=0-65535 }
        - {
            name: If-Range,
            in: header,
            schema: { type: string },
            description: ETag (sha256) para validar o Range.,
          }
      responses:
        '200':
          description: Representação completa.
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            ETag: { schema: { type: string } }
          content:
            audio/ogg:
              schema: { type: string, format: binary }
        '206':
          description: Parte do arquivo.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            audio/ogg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: 'Intervalo fora do arquivo; resposta traz `Content-Range: bytes */tamanho`.'
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
    head:
      tags: [media]
      operationId: headTrackStream
      summary: Cabeçalhos do streaming, sem corpo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cabeçalhos completos. }
        '206': { description: Cabeçalhos parciais (com Range). }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/albums:
    get:
      tags: [library]
      operationId: listAlbums
      summary: Lista álbuns.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página de álbuns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/artists:
    get:
      tags: [library]
      operationId: listArtists
      summary: Lista artistas.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página de artistas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/search:
    get:
      tags: [library]
      operationId: searchLibrary
      summary: Busca faixas (FTS5), álbuns e artistas.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Resultados agregados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/artworks/{id}:
    get:
      tags: [media]
      operationId: getArtwork
      summary: Capa original ou variante redimensionada em cache.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: size
          in: query
          schema: { type: string, default: full }
          description: '`full` (padrão), `thumb` (320), `card` (640) ou um número de 16 a 2048.'
      responses:
        '200':
          description: Imagem.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/setup/status:
    get:
      tags: [auth]
      operationId: getSetupStatus
      security: []
      summary: Indica se a instância ainda precisa de setup inicial.
      responses:
        '200':
          description: Estado do setup.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [required]
                properties:
                  required: { type: boolean }

  /api/v1/setup/claim:
    post:
      tags: [auth]
      operationId: claimSetup
      security: []
      summary: Reivindica o primeiro administrador com o código de setup (uso único).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, username, password]
              properties:
                code: { type: string }
                username: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Administrador criado; cookie de sessão definido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Autentica com usuário e senha e define o cookie de sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoga a sessão atual e limpa o cookie.
      responses:
        '204': { description: Sessão revogada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotaciona o token da sessão (revoga o anterior).
      responses:
        '200':
          description: Nova sessão.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário da sessão atual.
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/invitations:
    get:
      tags: [auth]
      operationId: listInvitations
      summary: Lista convites (admin).
      responses:
        '200':
          description: Convites recentes (sem token).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvitationItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      operationId: createInvitation
      summary: Cria convite para `user` ou `moderator` (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [user, moderator], default: user }
                expires_in_days: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '200':
          description: Convite criado; o token aparece uma única vez.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/invitations/{id}:
    delete:
      tags: [auth]
      operationId: revokeInvitation
      summary: Revoga um convite pendente (admin).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Convite revogado. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/invitations/redeem:
    post:
      tags: [auth]
      operationId: redeemInvitation
      security: []
      summary: Cria conta a partir de um convite válido (uso único).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, username, password]
              properties:
                token: { type: string }
                username: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Conta criada; cookie de sessão definido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: Playlists do usuário autenticado.
      responses:
        '200':
          description: Lista de playlists.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaylistSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Cria uma playlist privada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Playlist criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/playlists/{id}:
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Playlist com faixas na ordem atual.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Playlist do usuário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Renomeia ou altera a visibilidade.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                visibility: { type: string, enum: [private, unlisted] }
      responses:
        '200':
          description: Playlist atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Exclui a playlist (apenas do dono).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Playlist excluída. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playlists/{id}/items:
    post:
      tags: [playlists]
      operationId: addPlaylistItem
      summary: Adiciona uma faixa ao fim da playlist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [track_id]
              properties:
                track_id: { type: string, format: uuid }
      responses:
        '201':
          description: Faixa adicionada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [position]
                properties:
                  position: { type: integer, minimum: 0 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/playlists/{id}/items/{track_id}:
    delete:
      tags: [playlists]
      operationId: removePlaylistItem
      summary: Remove a faixa e recompacta as posições.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: track_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Faixa removida. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playlists/{id}/items/{track_id}/position:
    put:
      tags: [playlists]
      operationId: movePlaylistItem
      summary: Move a faixa para uma posição 0-based.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: track_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [position]
              properties:
                position: { type: integer, minimum: 0 }
      responses:
        '204': { description: Ordem atualizada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/favorites:
    get:
      tags: [favorites]
      operationId: listFavorites
      summary: Favoritos do usuário, agrupados por tipo.
      responses:
        '200':
          description: Favoritos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoritesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/favorites/{kind}/{id}:
    put:
      tags: [favorites]
      operationId: addFavorite
      summary: Marca como favorito (idempotente).
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { type: string, enum: [track, album, artist] },
          }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Favorito registrado. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [favorites]
      operationId: removeFavorite
      summary: Remove dos favoritos (idempotente).
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { type: string, enum: [track, album, artist] },
          }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Favorito removido. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Envia um arquivo Opus para staging (corpo binário bruto).
      parameters:
        - name: X-Zuno-Filename
          in: header
          required: true
          schema: { type: string }
          description: Nome original, usado apenas como metadado.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Arquivo em staging, validado como Opus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Arquivo maior que ZUNO_MAX_AUDIO_FILE_BYTES.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '415':
          description: Formato diferente de Opus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '422':
          description: Arquivo Opus inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /api/v1/uploads/{id}:
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Status de um upload.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [uploads]
      operationId: deleteUpload
      summary: Descarta o arquivo em staging (nunca toca na biblioteca).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Staging descartado. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/uploads/{id}/complete:
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Move para a biblioteca e indexa; duplicata responde 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Indexado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadComplete' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conteúdo já existe na biblioteca (nada é sobrescrito).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadComplete' }
        '422':
          description: Arquivo Opus inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /api/v1/me/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      summary: Preferências do usuário (tema e idioma).
      responses:
        '200':
          description: Preferências (defaults criados se necessário).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [preferences]
      operationId: updatePreferences
      summary: Atualiza tema e/ou idioma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                theme: { type: string, enum: [light, dark, system] }
                language: { type: string, examples: [pt-BR] }
      responses:
        '200':
          description: Preferências atualizadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/privacy:
    get:
      tags: [preferences]
      operationId: getPrivacy
      summary: Consentimento de uso do histórico em nuvem e retenção.
      responses:
        '200':
          description: Configuração de privacidade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [preferences]
      operationId: updatePrivacy
      summary: Atualiza consentimento e retenção do próprio histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                allow_cloud_history: { type: boolean }
                history_retention_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
      responses:
        '200':
          description: Privacidade atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/history:
    get:
      tags: [preferences]
      operationId: listHistory
      summary: Histórico de audição do próprio usuário (nunca de terceiros).
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [preferences]
      operationId: recordHistory
      summary: Registra um evento de reprodução do próprio usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [track_id, event_kind]
              properties:
                track_id: { type: string, format: uuid }
                event_kind: { type: string, enum: [play, skip, complete] }
                seconds: { type: number, minimum: 0, maximum: 86400 }
      responses:
        '201':
          description: Evento registrado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [preferences]
      operationId: clearHistory
      summary: Apaga o histórico do próprio usuário.
      responses:
        '204': { description: Histórico apagado. }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  responses:
    BadRequest:
      description: Parâmetro inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }

    Unauthorized:
      description: Sessão ausente/inválida ou credenciais incorretas.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Forbidden:
      description: Permissão insuficiente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Conflict:
      description: Conflito de estado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    TooManyAttempts:
      description: Muitas tentativas de login.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zuno_session

  schemas:
    Preferences:
      type: object
      additionalProperties: false
      required: [theme, language]
      properties:
        theme: { type: string, enum: [light, dark, system] }
        language: { type: string }

    PrivacySettings:
      type: object
      additionalProperties: false
      required: [allow_cloud_history, history_retention_days]
      properties:
        allow_cloud_history: { type: boolean }
        history_retention_days: { type: [integer, 'null'] }

    HistoryItem:
      type: object
      additionalProperties: false
      required: [id, track, event_kind, seconds, occurred_at]
      properties:
        id: { type: string, format: uuid }
        track: { $ref: '#/components/schemas/TrackSummary' }
        event_kind: { type: string, enum: [play, skip, complete] }
        seconds: { type: [number, 'null'] }
        occurred_at: { type: string }

    HistoryResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryItem' } }
        next_cursor: { type: [string, 'null'] }
    UploadCreated:
      type: object
      additionalProperties: false
      required: [upload_id, original_filename, size_bytes, sha256, status]
      properties:
        upload_id: { type: string, format: uuid }
        original_filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        status: { type: string, enum: [staged] }

    UploadDetail:
      type: object
      additionalProperties: false
      required: [upload_id, original_filename, size_bytes, sha256, status, track_id, error]
      properties:
        upload_id: { type: string, format: uuid }
        original_filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: [string, 'null'] }
        status: { type: string, enum: [staged, indexed, duplicate, failed] }
        track_id: { type: [string, 'null'], format: uuid }
        error: { type: [string, 'null'] }

    UploadComplete:
      type: object
      additionalProperties: false
      required: [upload_id, status, track_id]
      properties:
        upload_id: { type: string, format: uuid }
        status: { type: string, enum: [indexed, duplicate, not_pending] }
        track_id: { type: [string, 'null'], format: uuid }
    PlaylistSummary:
      type: object
      additionalProperties: false
      required: [id, name, visibility, track_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        visibility: { type: string, enum: [private, unlisted] }
        track_count: { type: integer, format: int64 }
        updated_at: { type: string }

    PlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/PlaylistSummary'
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TrackSummary' } }

    FavoritesResponse:
      type: object
      additionalProperties: false
      required: [tracks, albums, artists]
      properties:
        tracks: { type: array, items: { $ref: '#/components/schemas/TrackSummary' } }
        albums: { type: array, items: { $ref: '#/components/schemas/AlbumSummary' } }
        artists: { type: array, items: { $ref: '#/components/schemas/ArtistSummary' } }
    User:
      type: object
      additionalProperties: false
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, moderator, user] }

    SessionResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    CreatedInvitation:
      type: object
      additionalProperties: false
      required: [id, token, role, expires_in_days]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: 'Aparece apenas na criação.' }
        role: { type: string, enum: [user, moderator] }
        expires_in_days: { type: integer }

    InvitationItem:
      type: object
      additionalProperties: false
      required: [id, role, expires_at, redeemed_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, moderator] }
        expires_at: { type: string }
        redeemed_at: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'] }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, uptime_seconds, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, const: zuno-server }
        version: { type: string }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
        database: { $ref: '#/components/schemas/DatabaseHealth' }

    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, error] }

    ApiErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ArtistRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    AlbumRef:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }

    TrackSummary:
      type: object
      additionalProperties: false
      required: [id, title, duration_ms, track_no, disc_no, album, artists, artwork_id, available]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        duration_ms: { type: [integer, 'null'], format: int64 }
        track_no: { type: [integer, 'null'] }
        disc_no: { type: [integer, 'null'] }
        album: { oneOf: [{ $ref: '#/components/schemas/AlbumRef' }, { type: 'null' }] }
        artists: { type: array, items: { $ref: '#/components/schemas/ArtistRef' } }
        artwork_id: { type: [string, 'null'], format: uuid }
        available:
          { type: boolean, description: 'false quando nenhum arquivo disponível está indexado.' }

    AudioFileInfo:
      type: object
      additionalProperties: false
      required: [id, codec, container, bitrate, sample_rate, channels, size_bytes, available]
      properties:
        id: { type: string, format: uuid }
        codec: { type: string, examples: [opus] }
        container: { type: string, examples: [ogg] }
        bitrate: { type: [integer, 'null'] }
        sample_rate: { type: [integer, 'null'] }
        channels: { type: [integer, 'null'] }
        size_bytes: { type: integer, format: int64 }
        available: { type: boolean }

    TrackDetail:
      allOf:
        - $ref: '#/components/schemas/TrackSummary'
        - type: object
          additionalProperties: false
          required: [audio]
          properties:
            audio: { oneOf: [{ $ref: '#/components/schemas/AudioFileInfo' }, { type: 'null' }] }

    AlbumSummary:
      type: object
      additionalProperties: false
      required: [id, title, artist, release_year, artwork_id, track_count]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artist: { oneOf: [{ $ref: '#/components/schemas/ArtistRef' }, { type: 'null' }] }
        release_year: { type: [integer, 'null'] }
        artwork_id: { type: [string, 'null'], format: uuid }
        track_count: { type: integer, format: int64 }

    ArtistSummary:
      type: object
      additionalProperties: false
      required: [id, name, track_count, album_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        track_count: { type: integer, format: int64 }
        album_count: { type: integer, format: int64 }

    TrackListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TrackSummary' } }
        next_cursor: { type: [string, 'null'] }

    AlbumListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AlbumSummary' } }
        next_cursor: { type: [string, 'null'] }

    ArtistListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArtistSummary' } }
        next_cursor: { type: [string, 'null'] }

    SearchResponse:
      type: object
      additionalProperties: false
      required: [query, tracks, albums, artists]
      properties:
        query: { type: string }
        tracks: { type: array, items: { $ref: '#/components/schemas/TrackSummary' } }
        albums: { type: array, items: { $ref: '#/components/schemas/AlbumSummary' } }
        artists: { type: array, items: { $ref: '#/components/schemas/ArtistSummary' } }
