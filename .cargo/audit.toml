# Configuração do `cargo audit` (RustSec).

# RUSTSEC-2023-0071 — "Marvin Attack: potential key recovery through timing
# sidechannels" em `rsa 0.9.x`.
#
# Por que ignoramos:
# - `rsa` NÃO faz parte do grafo de build do Zuno. Ele aparece apenas no
#   `Cargo.lock` porque o SQLx declara dependências opcionais do driver MySQL
#   (que usa RSA para `caching_sha2_password`). Confirmado com:
#       cargo tree -i rsa        -> "nothing to print"
#       cargo tree -i sqlx-mysql -> "nothing to print"
# - O Zuno usa exclusivamente SQLite (`sqlx` com `default-features = false` e
#   apenas `runtime-tokio`, `sqlite`, `migrate`, `macros`).
# - Não existe versão corrigida publicada até o momento.
#
# Revisar quando: o SQLx publicar uma versão que remova `rsa` do lockfile, ou
# se o Zuno passar a usar MySQL (não previsto no PRD).
[advisories]
ignore = ["RUSTSEC-2023-0071"]
