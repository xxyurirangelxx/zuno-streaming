[workspace]
resolver = "3"
members = ["server"]
# O app Tauri 2 tem toolchain e dependências de sistema próprias (WebView2, GTK).
# Ele é compilado separadamente para não exigir essas dependências em todo `cargo test`.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Zuno contributors"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
infer = "0.22"
lofty = "0.25"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2.5"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
