[package]
name = "zuno-desktop"
version = "0.1.0"
description = "Aplicativo desktop do Zuno (Tauri 2)"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

# Este crate fica FORA do workspace Rust da raiz (ver `exclude` no Cargo.toml raiz),
# portanto não usa `workspace = true` e não entra no CI padrão no M0.

[lib]
name = "zuno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
